services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: interview_gen_backend
    ports:
      - "8000:8000"
    volumes:
      # Mount backend code into container
      # Any code change reflects instantly — no rebuild needed
      - ./backend:/app
    env_file:
      # Load .env file at runtime — secrets never baked into image
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      # Pings the /api/health/ endpoint every 30 seconds.
      # Docker restarts the container automatically if it stops responding.
      # Requires curl to be available in the image — see Dockerfile.
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s  # give gunicorn time to boot before first check